name: build-ipa
on: workflow_dispatch
jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen xcbeautify
      - run: xcodegen generate
      - name: Build unsigned (Sideloadly signs it with your Apple ID)
        shell: bash
        run: |
          set -o pipefail
          xcodebuild -project LidarCapture.xcodeproj -scheme LidarCapture -configuration Release -sdk iphoneos \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build 2>&1 | tee xcodebuild.log | xcbeautify --quieter || { grep -E "error|Error" xcodebuild.log | head -40; exit 1; }
      - run: |
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/LidarCapture.app Payload/
          zip -r LidarCapture.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: LidarCapture-ipa
          path: LidarCapture.ipa
